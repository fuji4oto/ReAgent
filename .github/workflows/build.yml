name: Build ReAgent
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3

      - name: Nuget restore
        run: nuget restore ReAgent.sln

      - name: Build Release Any CPU
        run: msbuild ReAgent.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ReAgent_编译结果
          path: bin/Release/ReAgent.dll
