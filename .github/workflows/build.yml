name: Build ReAgent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore ReAgent.sln

      - name: Rebuild ReAgent project
        run: msbuild src/ReAgent/ReAgent.csproj -t:Rebuild -p:Configuration=Release;Platform=x64 -verbosity:minimal

      - name: Find generated ReAgent.dll
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse ReAgent.dll -ErrorAction SilentlyContinue
          if ($files) {
            $files | ForEach-Object { Write-Host "Found dll: $($_.FullName)" }
          } else {
            Write-Warning "ReAgent.dll was NOT generated!"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReAgent‑Release‑dll
          path: bin/Release/ReAgent.dll
