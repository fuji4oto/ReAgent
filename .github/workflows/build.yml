name: Build ReAgent
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 获取ReAgent源码（包含已经上传的lib/ExileApi.dll）
        uses: actions/checkout@v5

      - name: 加载MSBuild编译工具
        uses: microsoft/setup-msbuild@v1.3

      - name: Nuget还原依赖包
        run: nuget restore ReAgent.sln

      - name: MSBuild编译Release x64
        run: msbuild ReAgent.sln /p:Configuration=Release /p:Platform=x64 /t:Rebuild

      - name: 上传编译产物ReAgent.dll
        uses: actions/upload-artifact@v6
        with:
          name: ReAgent_编译结果
          path: bin/Release/ReAgent.dll
