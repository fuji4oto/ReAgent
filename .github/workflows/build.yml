name: Build ReAgent
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 获取ReAgent源码
        uses: actions/checkout@v5

      # 拉取 ExileApi‑Compiled 仓库，取出 ExileCore.dll 放到lib文件夹
      - name: 获取依赖 ExileCore.dll
        uses: actions/checkout@v5
        with:
          repository: exApiTools/ExileApi‑Compiled
          path: extern/ExileApiCompiled

      - name: 复制dll到lib目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path lib -Force
          Copy-Item extern/ExileApiCompiled/ExileCore.dll lib/ExileCore.dll

      - name: 加载MSBuild编译工具
        uses: microsoft/setup-msbuild@v1.3

      - name: Nuget还原依赖包
        run: nuget restore ReAgent.sln

      - name: MSBuild编译Release x64
        run: msbuild ReAgent.sln /p:Configuration=Release /p:Platform=x64 /t:Rebuild

      - name: 上传编译产物ReAgent.dll
        uses: actions/upload-artifact@v6
        with:
          name: ReAgent_编译结果
          path: bin/Release/ReAgent.dll
